<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <title>Трекер задач</title>
</head>
<body>
    <h1>Задачи</h1>
    <form action="/" method="POST">     <!-- Форма добавления -->
        <input type="text" name="content" required>
        <button type="submit">Добавить</button>
    </form>

    <!-- Список задач и управляющие элементы -->
    <ul>    
        {% for task in tasks %}
            <li>
                <form action="/toggle/{{ task.id }}" method="POST">     <!-- Форма изменения статуса -->
                    <input type="checkbox" 
                        {% if task.done %}checked{% endif %} 
                        onchange="this.form.submit()" 
                        title="Отметить как выполненное">
                </form>

                <!-- Вывод самой задачи -->
                <span class="{% if task.done %}task-done{% endif %}">   
                    {{ task.content }}
                </span>

                <div class="task-actions">
                    <a href="/edit/{{ task.id }}">Редактировать</a> <!-- Ссылка на редактирование -->
                    
                    <form action="/delete/{{ task.id }}" method="POST"
                    onsubmit="return confirm('Точно удалить задачу?')">   <!-- Форма удаления --> 
                        <button type="submit">Удалить</button>
                    </form>
                </div>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
