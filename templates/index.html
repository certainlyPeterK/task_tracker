{% extends 'base.html' %}

{% block title %}Главная - Трекер задач{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="h3 mb-4 text-center">Список задач</h1>

            <!-- Форма добавления -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form action="/" method="POST" class="d-flex gap-2">
                        <input type="text" name="content" class="form-control" placeholder="Введите задачу..." required>
                        <button type="submit" class="btn btn-primary">Добавить</button>
                    </form>
                </div>
            </div>

            <!-- Фильтры -->
            <div class="filter-bar mb-3">
                <div class="btn-group w-100" role="group">
                    <a href="/?filter=all" class="btn btn-outline-primary {% if current_filter == 'all' %}active{% endif %}">Все</a>
                    <a href="/?filter=active" class="btn btn-outline-primary {% if current_filter == 'active' %}active{% endif %}">Активные</a>
                    <a href="/?filter=done" class="btn btn-outline-primary {% if current_filter == 'done' %}active{% endif %}">Выполненные</a>
                </div>
            </div>

            <!-- Список задач и управляющие элементы -->
            <ul class="list-group shadow-sm">
                {% for task in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    
                    <!-- Название и кнопка смены статуса -->
                    <div class="d-flex align-items-center gap-3">
                        <!-- Кнопка смены статуса -->
                        <input class="form-check-input fs-5 m-0 toggle-checkbox" type="checkbox" 
                            data-id="{{ task.id }}"
                            {% if task.done %}checked{% endif %}>
                        
                        <!-- Сама задача -->
                        <span class="{% if task.done %}task-done{% endif %} fs-5">
                            {{ task.content }}
                        </span>
                    </div>
                    
                    <!-- Кнопки действий -->
                    <div class="task-actions">
                        <!-- Ссылка на редактирование -->
                        <a href="/task/edit/{{ task.id }}?filter={{ current_filter }}" class="btn btn-sm btn-outline-secondary">Изменить</a>
                        
                        <!-- Форма удаления --> 
                        <form action="/delete/{{ task.id }}?filter={{ current_filter }}" method="POST" class="d-inline" onsubmit="return confirm('Удалить задачу?')">
                            <button data-id="{{ task.id }}" class="btn btn-sm btn-outline-danger delete-btn">Удалить</button>
                        </form>
                    </div>
                </li>
                {% else %}
                <li class="list-group-item text-center text-muted py-4">
                    Пока ничего...
                </li>
                {% endfor %}
            </ul>

        </div>
    </div>

<script>
   document.addEventListener('DOMContentLoaded', () => {
        
        // Обработчик для кнопок смены статуса
        document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const taskId = this.getAttribute('data-id');
                fetch('/task/toggle/' + taskId + window.location.search, { method: 'POST' })
                    .then(response => { if (response.ok) window.location.reload(); });
            });
        });

        // Обработчик для кнопок удаления
        document.querySelectorAll('.delete-btn').forEach(button => {
            button.addEventListener('click', function() {
                if (confirm('Удалить задачу?')) {
                    const taskId = this.getAttribute('data-id');
                    fetch('/task/delete/' + taskId + window.location.search, { method: 'POST' })
                        .then(response => { if (response.ok) window.location.reload(); });
                }
            });
        });

    });
</script>
{% endblock %}
