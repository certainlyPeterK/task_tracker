{% extends 'base.html' %}

{% block title %}Главная - Трекер задач{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="h3 mb-4 text-center">Список задач</h1>

            <!-- Форма добавления -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form action="/" method="POST" class="d-flex gap-2">
                        <input type="text" name="content" class="form-control" placeholder="Введите задачу..." required>
                        <button type="submit" class="btn btn-primary">Добавить</button>
                    </form>
                </div>
            </div>

            <!-- Фильтры -->
            <div class="filter-bar mb-3">
                <div class="btn-group w-100" role="group">
                    <a href="/?filter=all" class="btn btn-outline-primary {% if current_filter == 'all' %}active{% endif %}">Все</a>
                    <a href="/?filter=active" class="btn btn-outline-primary {% if current_filter == 'active' %}active{% endif %}">Активные</a>
                    <a href="/?filter=done" class="btn btn-outline-primary {% if current_filter == 'done' %}active{% endif %}">Выполненные</a>
                </div>
            </div>

            <!-- Список задач и управляющие элементы -->
            <ul class="list-group shadow-sm">
                {% for task in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    
                    <!-- Название и кнопка смены статуса -->
                    <div class="d-flex align-items-center gap-3">
                        <!-- Кнопка смены статуса -->
                        <form action="/toggle/{{ task.id }}?filter={{ current_filter }}" method="POST" class="m-0">
                            <input class="form-check-input fs-5 m-0" type="checkbox" 
                                   {% if task.done %}checked{% endif %} 
                                   onchange="this.form.submit()">
                        </form>
                        
                        <!-- Сама задача -->
                        <span class="{% if task.done %}task-done{% endif %} fs-5">
                            {{ task.content }}
                        </span>
                    </div>
                    
                    <!-- Кнопки действий -->
                    <div class="task-actions">
                        <!-- Ссылка на редактирование -->
                        <a href="/edit/{{ task.id }}?filter={{ current_filter }}" class="btn btn-sm btn-outline-secondary">Изменить</a>
                        
                        <!-- Форма удаления --> 
                        <form action="/delete/{{ task.id }}?filter={{ current_filter }}" method="POST" class="d-inline" onsubmit="return confirm('Удалить задачу?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                        </form>
                    </div>
                </li>
                {% else %}
                <li class="list-group-item text-center text-muted py-4">
                    Пока ничего...
                </li>
                {% endfor %}
            </ul>

        </div>
    </div>
{% endblock %}
